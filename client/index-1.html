<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191C22" media="(prefers-color-scheme: dark)">
<meta name="description" content="Nameplate — head-to-head baby name ranking.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nameplate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Nameplate</title>
<!-- Splash screen. Inlined (not in src/styles) so it paints on the very first
     frame, before the JS bundle and tokens.css have loaded. Colours mirror
     tokens.css (--paper / --ink / --brass-bright). Removed by
     src/splash.ts once the first screen is ready. -->
<style>
#splash{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#ECEDEF;color:#16181D;
  transition:opacity .45s ease, visibility 0s linear .45s;
}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .splash-kicker{
  font-family:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#B8862B;
  opacity:0;animation:splash-fade .6s ease .35s forwards;
}
#splash .splash-mark{
  font-family:"Bodoni Moda","Didot","Times New Roman",serif;
  font-size:clamp(44px,15vw,72px);font-weight:500;line-height:.95;letter-spacing:-.02em;
  animation:splash-settle .8s cubic-bezier(.2,.9,.3,1);
}
#splash .splash-rule{
  width:46px;height:1px;background:#B8862B;
  transform:scaleX(0);animation:splash-rule .5s ease .45s forwards;
}
@keyframes splash-settle{from{letter-spacing:.22em;opacity:0}to{letter-spacing:-.02em;opacity:1}}
@keyframes splash-fade{to{opacity:1}}
@keyframes splash-rule{to{transform:scaleX(1)}}
@media (prefers-color-scheme: dark){
  #splash{background:#0D0F13;color:#ECEDEF}
  #splash .splash-kicker{color:#EFC26A}
  #splash .splash-rule{background:#EFC26A}
}
@media (prefers-reduced-motion: reduce){
  #splash, #splash *{animation:none!important;transition:none!important}
  #splash .splash-kicker{opacity:1}
  #splash .splash-rule{transform:none}
}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading Nameplate">
  <div class="splash-mark">Nameplate</div>
  <div class="splash-rule"></div>
  <div class="splash-kicker">Names, head to head</div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
